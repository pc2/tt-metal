name: Build and publish exabox-tools image

# Publishes ghcr.io/tenstorrent/tt-metal/exabox-tools: one image for recover.sh,
# run_cluster_validation and the fabric system health check.
#
# Deliberately its own workflow rather than a job in upstream-tests.yaml. That workflow
# runs hardware tests on every topology and fails or gets cancelled often, and the exabox
# operators need a :latest that tracks main daily, not one that goes stale for weeks
# whenever upstream-tests is red. The only gate here is the build-time smoke test baked
# into dockerfile/exabox_tools/Dockerfile.
#
# Tags on every run:   exabox-tools:<git describe>      immutable, one per run
# Additionally:        exabox-tools:latest              on main (schedule or dispatch),
#                                                       or on a branch with update-latest=true

on:
  workflow_dispatch:
    inputs:
      update-latest:
        required: false
        type: boolean
        default: false
        description: >-
          Also move :latest when dispatched from a non-main branch.
          Ignored on main, where :latest always moves.
  schedule:
    # Daily, two hours ahead of the upstream-tests schedule so both are built from
    # roughly the same main.
    - cron: "0 10 * * *"

concurrency:
  group: exabox-tools-image-${{ github.ref }}
  cancel-in-progress: false

env:
  EXABOX_TOOLS_IMAGE_NAME: ghcr.io/tenstorrent/tt-metal/exabox-tools

jobs:
  check-harbor:
    uses: ./.github/workflows/check-harbor.yaml
  build-artifact:
    needs: check-harbor
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-artifact.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      harbor-prefix: ${{ needs.check-harbor.outputs.harbor-prefix }}
      platform: "Ubuntu 22.04"
      build-type: Release
      build-wheel: true
      build-umd-tests: true
      tracy: true
  build-and-push:
    needs: build-artifact
    permissions:
      packages: write
      contents: read
    runs-on: tt-ubuntu-2204-large-stable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 20
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-artifact.outputs.build-artifact-name }}
      - name: Extract build artifact
        run: |
          mkdir -p _tt-metal
          tar --zstd -xf ttm_any.tar.zst -C _tt-metal/
          ls -hal _tt-metal/build/tools/scaleout/run_cluster_validation
      - name: Download Python wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-artifact.outputs.wheel-artifact-name }}
      - name: Verify wheel exists
        run: ls -la ttnn-*.whl
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          suffix="$(git describe)"
          TAGS="${{ env.EXABOX_TOOLS_IMAGE_NAME }}:${suffix}"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ inputs.update-latest }}" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${{ env.EXABOX_TOOLS_IMAGE_NAME }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: dockerfile/exabox_tools/Dockerfile
          platforms: linux/amd64
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          context: ${{ github.workspace }}
          build-args: |
            TT_METAL_DEV_VERSION=latest
            TT_METAL_COMMIT_SHA=${{ github.sha }}
            IMAGE_VERSION=${{ steps.tags.outputs.suffix }}
          outputs: |
            type=registry,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
      - name: Summary
        run: |
          {
            echo "## exabox-tools image"
            echo
            echo "Commit: \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
